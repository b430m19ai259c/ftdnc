<button type="button" id="up" class="up" aria-label="voltar ao topo" hidden>↑</button><form class="chatbar" id="rf" role="region" aria-label="enviar relato" novalidate><div class="chatin"><textarea class="pill" id="msg" name="message" rows="1" maxlength="1500" placeholder="Escreva seu relato…" enterkeyhint="send" aria-label="seu relato"></textarea><input type="text" name="_honey" id="honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0"><button type="submit" class="go" id="dsend" aria-label="enviar relato" disabled><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 20.5v-6.7l9.5-1.8L3 10.2V3.5L22 12z" fill="currentColor"/></svg></button></div><div class="chatnote mono" id="dstat" role="status" aria-live="polite">Vai para análise, não aparece na hora</div></form>
<footer class="mono" aria-hidden="true"></footer></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const L='abcdefghijklmnopqrstuvwxyz';function fake(){let t='';for(let i=0,n=5+Math.floor(Math.random()*5);i<n;i++)t+=L[Math.floor(Math.random()*26)];return t}
document.querySelectorAll('[data-blur]').forEach(x=>{x.textContent=fake();x.setAttribute('aria-label','nome oculto')});
function fill(par,txt){txt.split(/(\[\[[xb]\]\])/).forEach(part=>{if(part==='[[x]]'){const x=el('span','blur',fake());x.setAttribute('aria-label','nome oculto');par.append(x)}else if(part==='[[b]]'){const i=el('span','logoblur');i.setAttribute('role','img');i.setAttribute('aria-label','nome da empresa oculto');par.append(i)}else par.append(part)})}
const voteKey='fdb-votes-v2';let votes={};try{votes=JSON.parse(localStorage.getItem(voteKey)||'{}')}catch{}
/* contagem de votos (contador gratuito de terceiros; 1 voto por relato por aparelho) */
const CB='https://abacus.jasoncameron.dev',CNS='ftdnc';
const cache=(()=>{try{return JSON.parse(sessionStorage.getItem('fdb-c')||'{}')}catch{return {}}})();
const saveCache=()=>{try{sessionStorage.setItem('fdb-c',JSON.stringify(cache))}catch{}};
const OLDK='fdb-last';const oldC=(()=>{try{return JSON.parse(localStorage.getItem(OLDK)||'{}')}catch{return {}}})();const old=k=>oldC[k]??'–';const keepOld=(k,c)=>{oldC[k]=c;try{localStorage.setItem(OLDK,JSON.stringify(oldC))}catch{}};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const queue=[];let busyQ=false;
async function pump(){if(busyQ)return;busyQ=true;const w=async()=>{while(queue.length){const t=queue.shift();await t();await sleep(450)}};await Promise.all([w(),w()]);busyQ=false}
function paint(v,id){['up','down'].forEach(t=>{const n=v.querySelector('[data-key="'+id+'-'+t+'"] .n');if(n)n.textContent=cache[id+'-'+t]??old(id+'-'+t)})}
function getCount(key){return fetch(CB+'/get/'+CNS+'/'+key).then(r=>r.status===404?0:r.ok?r.json().then(j=>j.value|0):null).catch(()=>null)}
function loadCounts(v,id){['up','down'].forEach(t=>{const k=id+'-'+t;if(cache[k]!==undefined)return;queue.push(async()=>{let c=null;for(let i=0;i<12&&c===null;i++){if(i)await sleep(1500*i);c=await getCount(k)}if(c!==null){cache[k]=c;keepOld(k,c);saveCache();paint(v,id)}})});pump()}
function watchCounts(id,v){v.dataset.id=id;paint(v,id);loadCounts(v,id)}
function castVote(id,type,v){
 if(votes[id])return;
 votes[id]=type;try{localStorage.setItem(voteKey,JSON.stringify(votes))}catch{}
 v.querySelectorAll('.vote').forEach(x=>{x.setAttribute('aria-pressed',String(x.dataset.key.endsWith('-'+type)));x.disabled=true});
 const k=id+'-'+type;cache[k]=(typeof cache[k]==='number'?cache[k]:0)+1;saveCache();paint(v,id);
 fetch(CB+'/hit/'+CNS+'/'+k).catch(()=>{})}


const WORDS=['mais','menos'],LET='abcdefghijklmnoprstvz';
function hash(t){let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const usedNames=new Set();
function nameFor(id){let h=hash(id);for(let k=0;k<400;k++){const a=LET[h%LET.length],w=WORDS[(h>>>5)%2],z=LET[(h>>>9)%LET.length];const n=a+w+z;if(a!==z&&!usedNames.has(n)){usedNames.add(n);return n}h=Math.imul(h,1103515245)+12345>>>0}return 'x'+id}
const AV=['a1','a2','a3','a4'];
let posts=[],order='old',onlyUnseen=false,tagSel=null;
const TAGS={};
function drawChips(){const box=$('#chips');if(!box)return;box.replaceChildren();const cnt={};posts.forEach(p=>(p.tags||[]).forEach(t=>{cnt[t]=(cnt[t]||0)+1}));if(!Object.keys(cnt).length)return;const mk=(k,label,n)=>{const b=el('button','tool',label);b.type='button';b.setAttribute('aria-pressed',String(tagSel===k));b.append(el('span','cn',String(n)));b.onclick=()=>{tagSel=(tagSel===k)?null:k;render()};box.append(b)};mk(null,'Todos',posts.length);Object.keys(TAGS).filter(k=>cnt[k]).sort((a,b)=>cnt[b]-cnt[a]).forEach(k=>mk(k,TAGS[k],cnt[k]))}
const seenKey='fdb-seen-v1';let seen={};try{seen=JSON.parse(localStorage.getItem(seenKey)||'{}')}catch{}
const markSeen=id=>{if(!seen[id]){seen[id]=1;try{localStorage.setItem(seenKey,JSON.stringify(seen))}catch{}updUnseen()}};
const isSeen=id=>!!(seen[id]||votes[id]);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fdate(t){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t||'');return m?(+m[3])+' '+MES[+m[2]-1]+' '+m[1]:''}
let firstVisit=false;try{const ret=['fdb-seen-v1','fdb-votes-v2','fdb-visit-day','fdb-draft','fdb-first'].some(k=>localStorage.getItem(k)!==null);firstVisit=!ret;localStorage.setItem('fdb-first','1')}catch{}
function updUnseen(){const n=posts.filter(p=>!isSeen(p.id)).length;const u=$('#ucount');if(u)u.textContent='('+n+')';
 const bd=$('#nbadge'),lb=$('#ler');if(bd){const show=n>0&&!firstVisit&&posts.length>0;bd.hidden=!show;if(show){bd.textContent=n>99?'99+':String(n);if(lb)lb.setAttribute('aria-label','Ler os relatos, '+n+(n===1?' novo':' novos'))}else if(lb)lb.removeAttribute('aria-label')}}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const seenTimers=new Map();
const seenIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{const id=e.target.dataset.id;
 const ok=e.isIntersecting&&(e.intersectionRatio>=.6||e.intersectionRect.height>=innerHeight*.5);
 clearTimeout(seenTimers.get(id));
 if(ok){seenTimers.set(id,setTimeout(()=>{markSeen(id);seenIO.unobserve(e.target)},1500))}}),{threshold:[0,.2,.4,.6,.8,1]}):null;
function render(){
 updUnseen();drawChips();
 feed.removeAttribute('aria-busy');
 usedNames.clear();posts.forEach(p=>{p._n=nameFor(p.id)});
 feed.replaceChildren();
 $('#count').textContent=posts.length;
 if(posts.length&&onlyUnseen&&!posts.some(p=>!isSeen(p.id))){const d=el('div','empty');d.append(el('strong',null,'Você viu todos.'),el('span',null,'Desligue "Só os que não vi" para rever os relatos.'));feed.append(d);return}
 if(!posts.length){const d=el('div','empty');d.append(el('strong',null,'Nenhum relato ainda.'),el('span',null,'As mensagens passam por revisão antes de aparecer aqui.'));feed.append(d);return}
 const list=posts.filter(p=>(!onlyUnseen||!isSeen(p.id))&&(!tagSel||(p.tags||[]).includes(tagSel))); if(order==='new')list.reverse();
 if(!list.length){const d=el('div','empty');d.append(el('strong',null,'Nenhum relato nesse filtro.'),el('span',null,'Escolha outro tipo ou toque em Todos.'));feed.append(d);return}
 list.forEach(p=>{
  const num=String(posts.indexOf(p)+1).padStart(2,'0');
  const card=el('article','card');const av=document.createElement('img');av.className='av';av.src='avatars/'+AV[posts.indexOf(p)%4]+'.jpg';av.alt='';av.width=46;av.height=46;av.loading='lazy';card.append(av);
  const cb=el('div','cb');const nk=el('div','nick');nk.append(el('span',null,p._n));if(p.data){const t=el('time','when',fdate(p.data));t.dateTime=p.data;nk.append(t)}cb.append(nk);
  const bubble=el('div','bubble');
  p.text.split(/\n{2,}/).forEach(t=>{const pe=el('p');fill(pe,t.trim());bubble.append(pe)});
  cb.append(bubble);
  if(p.text.length>260){bubble.classList.add('clip');const mb=el('button','more','Ler tudo');mb.type='button';mb.setAttribute('aria-expanded','false');mb.onclick=()=>{const o=bubble.classList.toggle('clip');mb.textContent=o?'Ler tudo':'Mostrar menos';mb.setAttribute('aria-expanded',String(!o))};cb.append(mb)}
  const meta=el('div','meta');meta.append(el('span','who',p.origem==='site'?'Depoimento enviado pelo site':'Depoimento tirado do perfil'));
  const v=el('div','votes');
  const ICON={up:'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>',down:'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>'};
  for(const [type,label] of [['up','concordo'],['down','discordo']]){
   const b=el('button','vote');b.type='button';b.innerHTML=ICON[type]+'<span class="n">–</span>';
   b.setAttribute('aria-label',label+' com este relato');b.dataset.key=p.id+'-'+type;
   b.setAttribute('aria-pressed',String(votes[p.id]===type));
   b.onclick=()=>castVote(p.id,type,v);
   v.append(b)}
  watchCounts(p.id,v);
  meta.append(v);cb.append(meta);
  card.append(cb);feed.append(card);if(seenIO&&!seen[p.id]){card.dataset.id=p.id;seenIO.observe(card)}})
}
function setOrder(o){order=o;$('#ordl').textContent=o==='old'?'Primeiros':'Últimos';$('#ordarr').textContent=o==='old'?'↓':'↑';render()}
$('#ord').onclick=()=>setOrder(order==='old'?'new':'old');
$('#unseen').onclick=()=>{onlyUnseen=!onlyUnseen;$('#unseen').setAttribute('aria-pressed',String(onlyUnseen));render()};

const msg=$('#msg'),dsend=$('#dsend'),dstat=$('#dstat');const IDLE='Vai para análise, não aparece na hora';const MAIL='b430m19ai259c@proton.me';
try{const d=localStorage.getItem('fdb-draft');if(d){msg.value=d}}catch{}

const ENDPOINT='https://formsubmit.co/ajax/b430m19ai259c@proton.me';
function grow(){msg.style.height='auto';msg.style.height=Math.min(msg.scrollHeight,130)+'px'}
msg.addEventListener('input',()=>{grow();try{localStorage.setItem('fdb-draft',msg.value)}catch{}dsend.disabled=msg.value.trim().length<10;if(dstat.dataset.s){dstat.textContent=IDLE;dstat.className='chatnote mono';delete dstat.dataset.s}});
if(msg.value){grow();dsend.disabled=msg.value.trim().length<10}
msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('#rf').requestSubmit()}});
$('#rf').addEventListener('submit',async e=>{e.preventDefault();if(msg.value.trim().length<10||$('#honey').value)return;
 dsend.disabled=true;dstat.dataset.s='1';dstat.textContent='Enviando…';
 try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({message:msg.value.trim(),_subject:'[FITDANCE] novo depoimento (ftdnc)',_captcha:'false',_template:'box'})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.success==='false')throw Error(j.message||'erro');
  msg.value='';try{localStorage.removeItem('fdb-draft')}catch{}grow();dstat.className='chatnote mono ok';dstat.textContent='Enviado! Obrigada. Vai para análise, não aparece na hora.'}
 catch(err){dstat.innerHTML='Não foi possível enviar agora. Seu texto está salvo. ';const a=document.createElement('a');a.href='mailto:'+MAIL+'?subject='+encodeURIComponent('relato')+'&body='+encodeURIComponent(msg.value.trim());a.textContent='Enviar por e-mail';dstat.append(a);dsend.disabled=msg.value.trim().length<10}});
$('#cta').onclick=()=>{msg.focus({preventScroll:true});msg.scrollIntoView({block:'center'})};
const up=$('#up');addEventListener('scroll',()=>{up.hidden=scrollY<900},{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});

function showFail(){feed.removeAttribute('aria-busy');feed.replaceChildren();const d=el('div','fail');d.append(el('strong',null,'Não deu pra carregar os relatos.'),el('span',null,'Confira sua conexão e tente de novo.'));const r=el('button',null,'Tentar de novo');r.type='button';r.onclick=load;d.append(document.createElement('br'),r);feed.append(d)}
function load(){feed.setAttribute('aria-busy','true');fetch('./approved-posts.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{posts=Array.isArray(d)?d.filter(p=>p&&typeof p.id==='string'&&typeof p.text==='string'&&p.text.trim()):[];render()}).catch(showFail)}
$('#ler').onclick=()=>$('#relatos').scrollIntoView({behavior:'smooth',block:'start'});
const feedEl=$('#feed');
feedEl.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c||e.target.closest('button,a'))return;
 const was=c.classList.contains('pop');feedEl.querySelectorAll('.card.pop').forEach(x=>x.classList.remove('pop'));
 if(!was){c.classList.add('pop');const b=c.querySelector('.bubble.clip'),m=c.querySelector('.more');if(b&&m)m.click()}});
document.addEventListener('click',e=>{if(!e.target.closest('.card'))feedEl.querySelectorAll('.card.pop').forEach(x=>x.classList.remove('pop'))});
/* contador de visitas: conta 1x por aparelho por dia; ?semcontar só lê */
(()=>{const vis=$('#vis');if(!vis)return;const day=new Date().toISOString().slice(0,10),K='fdb-visit-day';
 let novo=true;try{novo=localStorage.getItem(K)!==day}catch{}
 if(/semcontar/.test(location.search))novo=false;
 fetch(CB+'/'+(novo?'hit':'get')+'/'+CNS+'/visitas').then(r=>r.status===404?{value:0}:r.ok?r.json():Promise.reject()).then(j=>{
  if(novo){try{localStorage.setItem(K,day)}catch{}}
  const n=Number(j.value);if(Number.isFinite(n))vis.textContent=n.toLocaleString('pt-BR')}).catch(()=>{})})();
load();
})();
</script></body></html>
